name: Deploy PLAYAM Staging to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "admin-playam-staging.html"
      - "site/**"
      - ".github/workflows/deploy-staging-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playam-staging-pages
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Staging repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public Staging website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp admin-playam-staging.html _site/admin-playam-staging.html
          cp -R site _site/site
          touch _site/.nojekyll

      - name: Upload Staging website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Staging website
        id: deployment
        uses: actions/deploy-pages@v4
