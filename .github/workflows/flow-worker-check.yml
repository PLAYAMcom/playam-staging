name: PLAYAM Flow worker build checks

on:
  push:
    branches: [main, codex/flow-media-worker, codex/flow-worker-hardening]
    paths:
      - "worker/**"
      - "supabase/migrations/**"
      - ".github/workflows/flow-worker-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "supabase/migrations/**"
      - ".github/workflows/flow-worker-check.yml"

permissions:
  contents: read

jobs:
  python-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: pip install -r worker/requirements.txt
      - name: Compile worker
        run: python -m py_compile worker/worker.py
      - name: Build isolated Python worker container
        run: docker build -t playam-flow-media-worker:test worker
