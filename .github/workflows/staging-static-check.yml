name: PLAYAM Staging safety checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "site/**"
      - "scripts/staging-static-check.py"
      - "tests/**"
      - "playwright.config.js"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/staging-static-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "site/**"
      - "scripts/staging-static-check.py"
      - "tests/**"
      - "playwright.config.js"
      - "supabase/migrations/**"
      - ".github/workflows/staging-static-check.yml"

permissions:
  contents: read

jobs:
  staging-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Staging isolation and browser JavaScript
        run: python3 scripts/staging-static-check.py
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Staging webhook functions
        run: deno check supabase/functions/paystack-webhook/index.ts supabase/functions/flow-cloudflare-webhook/index.ts
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests
        run: npx playwright test
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playam-staging-browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
